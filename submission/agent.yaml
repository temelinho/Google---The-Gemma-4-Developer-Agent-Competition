# Google ADK Agent Config - kök ajan
name: root_coder
model: gemma-4-31b-it-qat-w4a16-ct
description: >
  Otonom yazilim muhendisligi ajani. Issue'yu okur, kod analistine danisarak
  ilgili kodu bulur, duzeltmeyi yapar ve patch olarak teslim eder.

instruction: !include prompts/system.md
generate_content_config: !include configs/sampling.yaml

# LoRA ek beyni (egitince): adapter: main_lora

tools:
  - run_command
  - submit_patch
  - get_status
  - read_file
  - edit_file
  - write_file
  - get_code_neighbors
  - search_similar_code
  - get_code_subgraph
  # Salt-okunur kod analisti alt-ajani (baglam tasarrufu - resmi ornek deseni)
  - agent_tool:
      config_path: sub_agents/code_analyzer.yaml
      skip_summarization: true
