# Salt-okunur kod analisti alt-ajani (AgentTool olarak cagrilir).
# Arama/okuma islerini bu ajan yapar; ana ajanin baglami kirlenmez.
# NOT: adapter satiri simdilik yok (henuz LoRA egitmedik). Egitince:
#   adapter: tool_lora
name: code_analyzer_agent
description: >
  Repo kaynak dosyalarini ve kod grafigini analiz eder; ilgili sembolleri,
  cagiranlari/cagirdiklari ve dosya konumlarini bulup ozetler. Degisiklik YAPMAZ.
model: gemma-4-31b-it-qat-w4a16-ct
instruction: !include ../prompts/analyzer.md
tools:
  - read_file
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
generate_content_config: !include ../configs/sampling.yaml
