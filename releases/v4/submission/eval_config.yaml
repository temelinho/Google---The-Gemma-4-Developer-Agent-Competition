# 120 hidden tasks x 4.25 min = 8.5 h maximum agent-loop time.
# The remaining 3.5 h is headroom for model loading, setup and extraction;
# this is a planning estimate, not a guarantee about scorer overhead.
evaluation:
  timeout_seconds: 60
  max_tool_calls: 48
  max_time_minutes: 4.25
  max_turns: 64
